      <h1>Alternative assets: connecting strategy to crypto</h1>
      <p class="meta">Talk · February 19, 2025 · Strategic Management, TCU</p>
      <div class="deck">
        <p class="dl"><a href="../../assets/writing/alternative-assets/alternative-assets-lucas-cashwell.pdf" download>Download the slides (PDF, 2.5 MB)</a> · <a href="../volatility/">Read the article version</a></p>
        <figure class="slide"><img src="../../assets/writing/alternative-assets/slide-1.webp" width="1600" height="900" alt="Title slide: Alternative-Assets, Connecting Strategic Management To Crypto. Lucas Cashwell, February 19th, 2025." decoding="async"><figcaption>1 / 4</figcaption></figure>
        <figure class="slide"><img src="../../assets/writing/alternative-assets/slide-2.webp" width="1600" height="900" alt="SkyBridge Capital and MicroStrategy overview. SkyBridge: a private company with a public product, the $CRPT ETF, which bets on alternative assets and related stocks like NVIDIA and Coinbase; some argued it was the best ETF of 2024, returning 74% for the year. MicroStrategy: a public company whose financial products are based solely on Bitcoin, mainly selling Bitcoin as a bond; the stock went up 477% in 2024. Shared challenge: create desirable investment tools for investors interested in crypto despite looming regulatory and social concerns." loading="lazy" decoding="async"><figcaption>2 / 4</figcaption></figure>
        <figure class="slide"><img src="../../assets/writing/alternative-assets/slide-3.webp" width="1600" height="900" alt="Strategy. SkyBridge pursues a differentiation strategy: its strength is picking the most desirable investments in all things crypto; it differentiates from frauds and naysayers by selling a package of the most popular crypto investments. MicroStrategy pursues a focused differentiation strategy: its strength is taking the scary volatility out of Bitcoin using debt, for risk-averse investors interested solely in Bitcoin. With the $CRPT top holdings table and Bitcoin and MicroStrategy price charts as of February 18, 2025." loading="lazy" decoding="async"><figcaption>3 / 4</figcaption></figure>
        <figure class="slide"><img src="../../assets/writing/alternative-assets/slide-4.webp" width="1600" height="900" alt="Recommendations. SkyBridge must keep picking the most popular crypto-related investments. Options in priority order: 1, create more specific ETFs for sects of crypto, such as a chip maker ETF or an alt-coin ETF; 2, build awareness and public sentiment toward crypto through advertising and lobbying; 3, offer personalized products for investors who are more risk-averse to crypto." loading="lazy" decoding="async"><figcaption>4 / 4</figcaption></figure>
